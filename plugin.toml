schema = "animus.plugin.v1"
name = "animus-subject-requirements"
version = "0.1.5"
plugin_kind = "subject_backend"
description = "Requirements subject backend (git-friendly structured records)"

[capabilities]
streaming = true
progress = false
cancellation = false

[binary]
default = "animus-subject-requirements"

[[env]]
key = "ANIMUS_REQUIREMENTS_ROOT"
description = "Root directory for requirement files (default: <project_root>/.animus/requirements)"
required = false

[[env]]
key = "ANIMUS_REQUIREMENTS_ID_PREFIX"
description = "ID prefix for requirement records (default: REQ)"
required = false

[[env]]
key = "ANIMUS_REQUIREMENTS_INDEX_TTL_SECS"
description = "_index.json cache TTL in seconds (default: 60)"
required = false

[[env]]
key = "ANIMUS_REQUIREMENTS_LEGACY_JSON"
description = "Path to in-tree legacy core-state.json for read+migrate compat (default: unset)"
required = false

[[env]]
key = "ANIMUS_SCOPED_ROOT"
description = "Scoped runtime root for fallback legacy path resolution (default: unset)"
required = false

[[env]]
key = "ANIMUS_REQUIREMENTS_MIGRATE_LEGACY"
description = "When truthy, run one-shot legacy JSON -> Markdown migration on startup (default: false)"
required = false
