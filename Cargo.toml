[package]
name = "animus-subject-requirements"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Requirements subject backend for Animus — git-friendly structured requirement records"
repository = "https://github.com/launchapp-dev/animus-subject-requirements"
homepage = "https://github.com/launchapp-dev/animus-cli"
readme = "README.md"
default-run = "animus-subject-requirements"

[lib]
name = "animus_subject_requirements"
path = "src/lib.rs"

[[bin]]
name = "animus-subject-requirements"
path = "src/main.rs"

[dependencies]
animus-plugin-protocol  = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.4" }
animus-subject-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.4" }
animus-plugin-runtime   = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.4" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
